# Public analytics demo. Portfolio storage stays unconfigured until access control is added.
services:
  - type: web
    name: marketlens-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/backend.Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'exec python -m uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1'
    healthCheckPath: /health
    envVars:
      - key: MARKETLENS_CORS_ORIGINS
        sync: false
      - key: MARKETLENS_CACHE_MAX_ENTRIES
        value: '16'
  - type: web
    name: marketlens-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
