name: marketlens
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/setup-env.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U marketlens -d marketlens']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      MARKETLENS_DATABASE_URL: postgresql+psycopg://marketlens:${POSTGRES_PASSWORD}@db:5432/marketlens
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      MARKETLENS_DATABASE_URL: postgresql+psycopg://marketlens:${POSTGRES_PASSWORD}@db:5432/marketlens
      MARKETLENS_CACHE_TTL_SECONDS: '300'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - '127.0.0.1:${MARKETLENS_WEB_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
